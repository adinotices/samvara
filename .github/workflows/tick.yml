name: Ratchet tick (auto-miss sweep)

# Calls POST /v1/tick on a schedule so a missed deadline is charged and parked
# even when nobody has the app open. This is the headless equivalent of the
# app's per-second checkAutoMiss. It is safe to run often: already-resolved
# commitments are skipped server-side, so ticks never double-charge.
#
# Required repository secrets:
#   SAMVARA_API_BASE_URL   same base the frontend uses
#   SAMVARA_API_TOKEN      the server's API_TOKEN
#
# NOTE: GitHub cron is best-effort and can be delayed under load. Your grace
# window is 24h by default, so a few minutes of jitter is irrelevant. If you
# need tighter timing, run this from a real cron / systemd timer instead (see
# deploy/README notes).
#
# Robustness: the request is bounded (connect/overall timeouts) and retried a
# few times, so a slow or momentarily unreachable server fails fast instead of
# hanging the job. timeout-minutes is a hard backstop in case something still
# gets stuck, so a bad run can never again silently burn a full cron interval.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

concurrency:
  group: ratchet-tick
  cancel-in-progress: true   # a fresh tick supersedes a stale one; never queue

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /v1/tick
        env:
          BASE: ${{ secrets.SAMVARA_API_BASE_URL }}
          TOKEN: ${{ secrets.SAMVARA_API_TOKEN }}
        run: |
          set -uo pipefail
          # NOTE: Actions runs this with `bash -e`, so errexit is on no matter
          # what `set` says here. Every curl below therefore uses the
          # `|| curl_exit=$?` form: a bare `code=$(curl ...)` would abort the
          # step on the first transport failure and skip the retry logic
          # entirely — which is exactly the case this is here to handle.

          # Normalize: strip trailing slash and an optional trailing /v1.
          BASE="${BASE%/}"; BASE="${BASE%/v1}"

          # Long enough not to truncate a real sweep: /v1/tick charges
          # sequentially, one Beeminder call per past-grace commitment and per
          # unbilled penalty day, each capped at 15s server-side. A tight cap
          # here would cut off a sweep that was working fine.
          MAX_TIME=120

          attempt=1
          max_attempts=3

          while :; do
            curl_exit=0
            code=$(curl -sS -o /tmp/tick.out -w "%{http_code}" \
              --connect-timeout 10 --max-time "$MAX_TIME" \
              -X POST "$BASE/v1/tick" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json") || curl_exit=$?

            if [ "$curl_exit" -eq 0 ] && [ "${code:0:1}" = "2" ]; then
              echo "HTTP $code (attempt $attempt)"
              # Deliberately NOT printing the response body, nor the error
              # strings: on a public repo these logs are world-readable and both
              # carry commitment names and amounts. Counts and opaque ids are
              # all this log needs — the server logs the reasons in full.
              jq -r '"charged=\(.charged_count // 0)"
                   + " errors=\((.errors // []) | length)"
                   + " penalties=\(.penalties_charged_count // 0)"
                   + " penalty_errors=\((.penalty_errors // []) | length)"' \
                /tmp/tick.out 2>/dev/null || true

              # A 200 does NOT mean money moved. The sweep reports per-item
              # failures in `errors` / `penalty_errors` and still returns 200,
              # so without this check a permanently failing charge (expired
              # Beeminder token, a stake over MAX_CHARGE_USD, Beeminder
              # rejecting) would retry every 15 minutes forever behind a green
              # tick. This app's whole premise is that the charge lands, so a
              # sweep that could not charge is a failed run.
              failed=$(jq -r '((.errors // []) | length) + ((.penalty_errors // []) | length)' \
                /tmp/tick.out 2>/dev/null || echo 0)
              if [ "${failed:-0}" != "0" ]; then
                echo "tick reported $failed failed charge(s):"
                jq -r '[((.errors // [])[] | .id // "?"),
                        ((.penalty_errors // [])[] | .day // "?")] | join(", ")' \
                  /tmp/tick.out 2>/dev/null || true
                echo "Reasons are in the server logs (kept out of this public log)."
                exit 1
              fi

              echo "tick ok"
              exit 0
            fi

            # Only retry failures where the server provably did no work. This
            # endpoint moves real money, so "no response" is not the same as
            # "nothing happened".
            case "$curl_exit" in
              6|7)
                # DNS / connection refused: the request never landed. This is
                # the observed failure mode — the app logged no POST at all.
                reason="could not reach the server (curl $curl_exit)"
                ;;
              28)
                # Timed out waiting for a response. The sweep may still be
                # running server-side, holding its in-process charge lock. A
                # retry would queue behind it, and the disconnect can cancel an
                # in-flight Beeminder charge. Bail out instead: the sweep is
                # idempotent and grace is 24h, so the next tick covers it.
                echo "tick timed out after ${MAX_TIME}s; the sweep may still be" \
                     "running server-side. Not retrying — next tick will cover it."
                exit 1
                ;;
              0)
                case "$code" in
                  # 5xx: server did not complete the request. Safe to retry —
                  # already-charged items are skipped server-side.
                  5*) reason="server error (HTTP $code)" ;;
                  # 4xx is a bad token or bad base URL; retrying never helps.
                  *)  echo "tick failed (HTTP $code) — not retryable"; exit 1 ;;
                esac
                ;;
              *)
                echo "tick failed (curl exit $curl_exit) — not retryable"
                exit 1
                ;;
            esac

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "tick failed after $attempt attempts: $reason"
              exit 1
            fi
            echo "attempt $attempt failed: $reason; retrying in 5s"
            attempt=$((attempt + 1))
            sleep 5
          done
