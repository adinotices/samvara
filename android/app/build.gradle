plugins {
    id 'com.android.application'
}

android {
    namespace 'app.samvara.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'app.samvara.shell'
        minSdk 26          // adaptive icons + java.time + notification channels
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
            versionNameSuffix ' (debug)'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            // For app signing, set the signingConfig below to your release key.
            // signingConfig signingConfigs.release
        }
    }

    // Signing configuration template for release builds.
    // Uncomment and configure with your actual keystore details:
    // signingConfigs {
    //     release {
    //         storeFile file('release.keystore')
    //         storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
    //         keyAlias System.getenv('KEY_ALIAS') ?: ''
    //         keyPassword System.getenv('KEY_PASSWORD') ?: ''
    //     }
    // }
}

// No dependencies block: framework APIs only (WebView, JobScheduler,
// NotificationManager, HttpURLConnection, org.json). See settings.gradle.
