# Fly.io deployment. From the repo root:
#
#   fly launch --no-deploy --copy-config --dockerfile backend/Dockerfile
#
#   # Postgres (recommended — see backend/README / the multi-tenant port notes
#   # for why SQLite doesn't hold up multi-tenant). Either:
#   #   fly postgres create --name samvara-db && fly postgres attach samvara-db
#   #     (this sets the DATABASE_URL secret for you)
#   # or point DATABASE_URL at any managed Postgres (Neon, Supabase, RDS, ...):
#   fly secrets set DATABASE_URL=postgresql+psycopg://...
#
#   # SQLite fallback, only if you're deliberately not on Postgres yet:
#   fly volumes create samvara_data --size 1
#
#   fly secrets set API_TOKEN=... BEEMINDER_TOKEN=... BEEMINDER_USER=... \
#                   ALLOWED_ORIGINS=https://samvara.app BEEMINDER_DRYRUN=true \
#                   AUTH_EMAIL=you@example.com RESEND_API_KEY=...
#   fly deploy
#
# Adjust `app` and `primary_region` before launching.

app = "samvara-api"
primary_region = "iad"

[build]
  # Relative to THIS file. Deploy with the backend dir as the build context:
  #   flyctl deploy ./backend -c deploy/fly/fly.toml
  dockerfile = "../../backend/Dockerfile"

[env]
  AUTH_MODE = "token"
  # "invite" until you've deliberately decided to open signup — this app
  # charges real money. See SIGNUP_MODE in .env.example.
  SIGNUP_MODE = "invite"
  # Both origins the frontend may be served from: the custom domain and the
  # bare GitHub Pages origin (used until samvara.app DNS is configured).
  ALLOWED_ORIGINS = "https://samvara.app,https://adinotices.github.io"
  BEEMINDER_DRYRUN = "false"
  MIN_STAKE = "1.00"
  MAX_CHARGE_USD = "50.00"
  GRACE_HOURS = "24"
  # Ignored once the DATABASE_URL secret is set (Postgres) — kept as the
  # fallback path for a SQLite deployment.
  SAMVARA_DB = "/data/samvara.db"

# Only load-bearing for the SQLite fallback path. On Postgres (DATABASE_URL
# set as a secret, above), delete this block — the database lives with your
# Postgres provider, not on this machine's volume.
[[mounts]]
  source = "samvara_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  # /v1/health/ready (not /v1/health) actually checks the database, so a
  # locked WAL file or an unmounted volume takes the machine out of rotation
  # instead of reporting healthy while unable to serve real traffic.
  method = "GET"
  path = "/v1/health/ready"
  interval = "30s"
  timeout = "5s"
